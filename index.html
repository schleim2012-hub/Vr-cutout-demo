<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Cutout Horror: Escape Demo</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <style>
      /* Retro Horror HUD Overlay */
      #ui-layer {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        color: #ff3333;
        font-family: 'Courier New', Courier, monospace;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 0px #000;
        pointer-events: none; /* Klicks gehen durch das UI durch */
      }
      #win-message {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 999;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
        font-size: 48px;
        font-weight: bold;
        text-align: center;
        text-shadow: 3px 3px 0px #000;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border: 2px solid #00ff00;
      }
    </style>
  </head>
  <body>
    <!-- HUD -->
    <div id="ui-layer">SCHLÜSSEL: <span id="score">0</span> / 3</div>
    <div id="win-message">TÜR GEÖFFNET!<br>ENTKOMMEN!</div>

    <a-scene fog="type: exponential; color: #050505; density: 0.15">
      
      <!-- 1. RAUM & UMGEBUNG -->
      <a-entity position="0 0 0">
        <a-plane position="0 0 -5" rotation="-90 0 0" width="30" height="30" color="#151515" roughness="0.9"></a-plane>
        <a-box position="-7.5 2.5 -5" rotation="0 90 0" width="30" height="5" depth="0.1" color="#222"></a-box>
        <a-box position="7.5 2.5 -5" rotation="0 -90 0" width="30" height="5" depth="0.1" color="#222"></a-box>
        <a-box position="0 2.5 -12.5" rotation="0 0 0" width="15" height="5" depth="0.1" color="#222"></a-box>
        <a-plane position="0 5 -5" rotation="90 0 0" width="30" height="30" color="#111"></a-plane>
      </a-entity>

      <!-- 2. DIE TÜR (Ziel) -->
      <a-box id="door" position="0 1.5 -12" width="2.5" height="3" depth="0.2" color="#550000" 
             animation="property: color; to: #005500; dur: 500; startEvents: dooropen">
        <a-text value="EXIT" align="center" position="0 0.5 0.11" color="#000" width="4"></a-text>
      </a-box>

      <!-- 3. DER CUTOUT-MONSTER (nähert sich langsam) -->
      <a-entity position="0 1.5 -10" look-at="#player-camera"
                animation="property: position; to: 0 1.5 -3; dur: 25000; easing: linear">
        <a-image src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 150'><path d='M50 10 C30 10 20 30 20 50 C20 70 10 80 10 100 L10 140 L35 140 L35 110 L65 110 L65 140 L90 140 L90 100 C90 80 80 70 80 50 C80 30 70 10 50 10 Z' fill='%23000' stroke='%23ff0000' stroke-width='3'/></svg>" 
                 width="2.5" height="3.5" transparent="true" shader="flat">
        </a-image>
      </a-entity>

      <!-- 4. DIE 3 SCHLÜSSEL (Interaktiv) -->
      <!-- Schlüssel 1: Links oben -->
      <a-entity class="key clickable" position="-4 2 -6" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
                onclick="collectKey(this)">
        <a-octahedron color="#00ffff" radius="0.3" material="emissive: #00ffff; emissiveIntensity: 2"></a-octahedron>
      </a-entity>
      
      <!-- Schlüssel 2: Rechts unten -->
      <a-entity class="key clickable" position="4 0.8 -7" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                onclick="collectKey(this)">
        <a-octahedron color="#00ffff" radius="0.3" material="emissive: #00ffff; emissiveIntensity: 2"></a-octahedron>
      </a-entity>

      <!-- Schlüssel 3: Mitte hoch -->
      <a-entity class="key clickable" position="0 3 -8" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear"
                onclick="collectKey(this)">
        <a-octahedron color="#00ffff" radius="0.3" material="emissive: #00ffff; emissiveIntensity: 2"></a-octahedron>
      </a-entity>

      <!-- 5. BELEUCHTUNG -->
      <a-light type="point" position="0 4 -5" color="#ffaaaa" intensity="1.5" distance="15"
               animation="property: intensity; from: 1.0; to: 2.0; dir: alternate; dur: 200; loop: true"></a-light>
      <a-light type="ambient" color="#111111" intensity="0.5"></a-light>

      <!-- 6. SPIELER & STEUERUNG (Maus + VR Controller) -->
      <a-entity id="player-camera" camera position="0 1.6 0" look-controls wasd-controls>
        <!-- Fused Cursor für VR (Gaze) und Desktop (Klick) -->
        <a-entity cursor="fuse: true; fuseTimeout: 1500"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #ff3333; shader: flat"
                  animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                  animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1"
                  animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1">
        </a-entity>
      </a-entity>
      
      <!-- VR Controller Laser-Pointer -->
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10"></a-entity>

    </a-scene>

    <!-- SPIEL-LOGIK -->
    <script>
      let keysCollected = 0;
      const totalKeys = 3;

      function collectKey(element) {
        // Verhindern, dass ein bereits eingesammelter Schlüssel gezählt wird
        if (element.getAttribute('visible') === false) return;

        // Schlüssel verschwinden lassen
        element.setAttribute('visible', false);
        
        // Zähler erhöhen und UI aktualisieren
        keysCollected++;
        document.getElementById('score').innerText = keysCollected;

        // Visuelles Feedback (Bildschirm kurz aufblitzen lassen)
        document.body.style.backgroundColor = '#003333';
        setTimeout(() => { document.body.style.backgroundColor = '#000'; }, 100);

        // Prüfen, ob alle Schlüssel gesammelt wurden
        if (keysCollected >= totalKeys) {
          // Tür öffnen
          const door = document.getElementById('door');
          door.emit('dooropen'); // Startet die Farb-Animation
          door.setAttribute('animation__open', 'property: rotation; to: 0 -90 0; dur: 1000; easing: easeOutQuad');
          
          // Gewinn-Nachricht anzeigen
          document.getElementById('win-message').style.display = 'block';
          
          // Monster stoppen (optional, aber fair)
          const monster = document.querySelector('a-entity[look-at="#player-camera"]');
          monster.removeAttribute('animation');
        }
      }

      // VR-Controller Klick-Event unterstützen
      document.querySelectorAll('.clickable').forEach(el => {
        el.addEventListener('click', function() {
          collectKey(this);
        });
      });
    </script>
  </body>
</html>
