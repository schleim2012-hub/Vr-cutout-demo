<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>VR Cutout Horror Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- A-Frame Core (3D/WebXR Engine) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Look-At Komponente: Lässt das 2D-Bild immer zur Kamera schauen -->
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
  </head>
  <body>
    <!-- Szene mit dunklem Nebel für Horror-Atmosphäre -->
    <a-scene fog="type: exponential; color: #050505; density: 0.12">
      
      <!-- 1. Die 3D-Umgebung (Dunkler Raum / Labor) -->
      <a-entity position="0 0 0">
        <!-- Boden -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#1a1a1a" roughness="0.9"></a-plane>
        <!-- Wände -->
        <a-box position="-5 2 -4" rotation="0 90 0" width="20" height="4" depth="0.1" color="#2a2a2a"></a-box>
        <a-box position="5 2 -4" rotation="0 -90 0" width="20" height="4" depth="0.1" color="#2a2a2a"></a-box>
        <a-box position="0 2 -9" rotation="0 0 0" width="10" height="4" depth="0.1" color="#2a2a2a"></a-box>
        <!-- Decke -->
        <a-plane position="0 4 -4" rotation="90 0 0" width="20" height="20" color="#111111"></a-plane>
      </a-entity>

      <!-- 2. Der "Digitalisierte Cutout" Charakter (Billboard-Effekt) -->
      <!-- TIPP: Ersetze die 'src' unten später mit deinem eigenen freigestellten .png Bild -->
      <a-entity position="0 1.5 -5" look-at="#player-camera">
        <!-- Platzhalter-Silhouette (SVG Data URI, damit es sofort ohne externe Dateien funktioniert) -->
        <a-image 
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 150'><path d='M50 10 C30 10 20 30 20 50 C20 70 10 80 10 100 L10 140 L35 140 L35 110 L65 110 L65 140 L90 140 L90 100 C90 80 80 70 80 50 C80 30 70 10 50 10 Z' fill='%230a0a0a' stroke='%23ffffff' stroke-width='2'/></svg>" 
          width="2" 
          height="3" 
          transparent="true"
          shader="flat">
        </a-image>
      </a-entity>

      <!-- 3. Atmosphäre: Flackerndes rotes Licht -->
      <a-light type="point" position="0 3.5 -5" color="#ff2222" intensity="2" distance="12"
               animation="property: intensity; from: 1.5; to: 2.5; dir: alternate; dur: 150; loop: true"></a-light>
      <a-light type="ambient" color="#111111" intensity="0.4"></a-light>

      <!-- 4. Spieler & VR-Steuerung -->
      <a-entity id="player-camera" camera position="0 1.6 0" look-controls wasd-controls>
        <a-cursor color="#ff2222" scale="0.5 0.5 0.5"></a-cursor>
      </a-entity>
      
      <!-- VR-Controller Unterstützung (z.B. Meta Quest) -->
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>

    </a-scene>
  </body>
</html>
